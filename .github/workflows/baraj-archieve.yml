name: Günlük EPİAŞ Baraj Arşivi

on:
  schedule:
    - cron: "0 18 * * *"
      timezone: "Europe/Istanbul"
  workflow_dispatch:

concurrency:
  group: daily-epias-baraj-archive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-archive:
    name: Baraj Excel arşivini güncelle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EPIAS_USERNAME: ${{ secrets.EPIAS_USERNAME }}
      EPIAS_PASSWORD: ${{ secrets.EPIAS_PASSWORD }}
      CK_EPIAS_JSON_CACHE_ENABLED: "false"

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: CK-ENERJI-WEBSITE/requirements.txt

      - name: Bağımlılıkları kur
        run: python -m pip install -r CK-ENERJI-WEBSITE/requirements.txt

      - name: EPİAŞ secret'larını doğrula
        shell: bash
        run: |
          if [[ -z "$EPIAS_USERNAME" || -z "$EPIAS_PASSWORD" ]]; then
            echo "::error::EPIAS_USERNAME ve EPIAS_PASSWORD Repository Secret olarak tanımlanmalıdır."
            exit 1
          fi

      - name: EPİAŞ verisini Excel'e ekle
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if python CK-ENERJI-WEBSITE/scripts/update_baraj_archive.py; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "EPİAŞ isteği başarısız oldu; 30 saniye sonra yeniden denenecek."
              sleep 30
            fi
          done
          exit 1

      - name: Güncel Excel'i depoya kaydet
        shell: bash
        run: |
          workbook="CK-ENERJI-WEBSITE/Aktif_Doluluk-Delta - Kopya.xlsx"
          if git diff --quiet -- "$workbook"; then
            echo "Yeni yayımlanmış tam gün yok; commit oluşturulmadı."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$workbook"
          git commit -m "chore(baraj): günlük EPİAŞ arşivini güncelle"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
